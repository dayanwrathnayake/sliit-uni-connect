spring.application.name=sliit-uni-connect

# ── MongoDB ────────────────────────────────────────────────────────────────────
# The database name is already in the URI — do NOT set spring.data.mongodb.database
# here as well, it causes Spring Boot to ignore the URI and fall back to localhost:27017
spring.data.mongodb.uri=mongodb+srv://admin:btTPWPOmUPI1H81W@cluster0.9zt87xu.mongodb.net/sliit_uni_connect

# ── JWT ────────────────────────────────────────────────────────────────────────
# Secret must be ≥ 32 characters for HS256 — change this before deploying!
jwt.secret=sliit-uni-connect-super-secret-key-change-in-prod-2024!
jwt.access-token-expiry-ms=900000
jwt.refresh-token-expiry-ms=604800000

# ── Mail (Gmail SMTP) ──────────────────────────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-gmail@gmail.com
spring.mail.password=your-app-password-here
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

# ── App ────────────────────────────────────────────────────────────────────────
app.base-url=http://localhost:5173

# ── Server ────────────────────────────────────────────────────────────────────
server.port=8080